[package]
name = "couchdeck"
version = "0.4.5"
edition = "2021"
rust-version = "1.85"
description = "Family-friendly, controller-first game launcher for Linux living-room PCs"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.23"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fs2 = "0.4.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

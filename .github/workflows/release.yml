name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (e.g. v0.3.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve and verify version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag '$tag' does not match Cargo.toml version 'v$version'." >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build and test in clean Fedora 42
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env VERSION="${{ steps.version.outputs.version }}" \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            registry.fedoraproject.org/fedora:42 \
            /work/scripts/ci-build-release.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: couchdeck-release-assets
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*runtime-info.txt
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CouchDeck ${{ steps.version.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*runtime-info.txt
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
